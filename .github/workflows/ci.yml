name: CI

on:
  push:
    branches: [main, master, agentic-v1]
  pull_request:
    branches: [main, master, agentic-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Mma.Cli.sln
      - name: Build
        run: dotnet build Mma.Cli.sln --no-restore -c Release --warnaserror:NU1903
      - name: Test
        run: dotnet test Mma.Cli.sln --no-build -c Release --verbosity normal --logger "trx;LogFileName=test-results.trx"
